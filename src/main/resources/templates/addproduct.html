<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1>Add Product</h1>

    <form th:action="@{/products/save}"
          th:object="${product}"
          method="post">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text"
                   th:field="*{category}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number"
                   step="0.01"
                   th:field="*{price}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number"
                   th:field="*{quantity}"
                   class="form-control"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Product
        </button>

        <a th:href="@{/products}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

</body>
</html>
